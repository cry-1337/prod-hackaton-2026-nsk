global:
    scrape_interval: 15s
    scrape_timeout: 5s
    evaluation_interval: 15s

storage:
    tsdb:
        retention:
            time: 15d
            size: 1GB

rule_files:
    - alerts.yml

scrape_configs:
    - job_name: vmeste-api
      metrics_path: /metrics
      static_configs:
          - targets: ["api:8080"]
