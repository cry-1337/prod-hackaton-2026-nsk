services:
    api:
        image: ${IMAGE_NAME:?Set IMAGE_NAME}
        build: !reset null
        restart: unless-stopped
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            Documentation__Enabled: ${SCALAR_ENABLED:-true}
            PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            Storage__PublicBucketUrl: ${MINIO_PUBLIC_BUCKET_URL:-https://hack-ovb-02-vm1-369056.vm.prodcontest.com/media/catalog}
        ports: !reset []

    prometheus:
        restart: unless-stopped
        environment:
            SAGE_API_KEY_FILE: ${SAGE_API_KEY_FILE:-}
            SAGE_ENVIRONMENT: ${SAGE_ENVIRONMENT:-stand}
            SAGE_DATACENTER: ${SAGE_DATACENTER:-ru-central1-d}
        volumes:
            - ./.secrets/sage:/run/vmeste-sage:ro
        ports: !reset []
        labels:
            com.vmeste.monitoring-config: ${MONITORING_CONFIG_HASH:-local}

    grafana:
        restart: unless-stopped
        ports: !reset []
        labels:
            com.vmeste.monitoring-config: ${MONITORING_CONFIG_HASH:-local}
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
            GF_SECURITY_COOKIE_SECURE: "true"
            GF_SERVER_ROOT_URL: https://hack-ovb-02-vm1-369056.vm.prodcontest.com/grafana/
            GF_SERVER_SERVE_FROM_SUB_PATH: "true"
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]

    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        labels:
            com.vmeste.caddy-config: ${CADDY_CONFIG_HASH:-local}
        ports:
            - "80:80"
            - "443:443"
        configs:
            - source: caddyfile
              target: /etc/caddy/Caddyfile
        volumes:
            - caddy-data:/data
        networks:
            - default
            - web

    postgres:
        restart: unless-stopped
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
        ports: !reset []

    redis:
        restart: unless-stopped
        ports: !reset []

    minio:
        restart: unless-stopped
        environment:
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
        ports: !reset []

    minio-init:
        environment:
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}

networks:
    web:
        name: vmeste-web

configs:
    caddyfile:
        content: |
            hack-ovb-02-vm1-369056.vm.prodcontest.com {
                redir /api /api/ 308
                redir /grafana /grafana/ 308

                handle /grafana/* {
                    reverse_proxy grafana:3000
                }

                handle /metrics {
                    @unsupported not method GET HEAD
                    header @unsupported Allow "GET, HEAD"
                    respond @unsupported 405
                    reverse_proxy api:8080
                }

                handle /api/* {
                    @health path /api/ /api/health
                    rewrite @health /health
                    reverse_proxy api:8080
                }

                @product_images {
                    method GET HEAD
                    path /media/catalog/products/*
                }

                handle @product_images {
                    uri strip_prefix /media
                    reverse_proxy minio:9000
                }

                handle {
                    reverse_proxy frontend:8080
                }
            }

volumes:
    caddy-data:
